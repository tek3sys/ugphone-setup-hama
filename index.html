<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGPhone 初期設定</title><style>body{font-family:system-ui,sans-serif;background:#f5f6fa;color:#182033;margin:0;padding:24px}main{max-width:480px;margin:auto}h1{font-size:25px}p{line-height:1.6}.step{background:white;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 2px 12px #0000000a}.step h2{font-size:17px;margin:0 0 8px}a{display:block;background:#2463eb;color:white;text-decoration:none;text-align:center;border-radius:10px;padding:13px;font-weight:650;margin-top:12px}.note{font-size:13px;color:#5a6477}</style></head><body><main><h1>UGPhone 初期設定</h1><p>上から順に進めてください。Googleアカウントの認証とインストール操作は手動です。</p><section class="step"><h2>1. Google Playにログイン</h2><p>Google Playを開き、未ログインの場合はGoogleアカウントを追加してください。</p><a href="https://play.google.com/store/apps">Google Playを開く</a></section><section class="step"><h2>2. Nova Launcher</h2><a href="https://play.google.com/store/apps/details?id=com.teslacoilsw.launcher">Nova Launcherのページへ</a><p class="note">インストール後、ホームアプリの変更はAndroidの設定から行ってください。</p></section><section class="step"><h2>3. クリックアシスタント</h2><a href="https://play.google.com/store/search?q=%E3%82%AF%E3%83%AA%E3%83%83%E3%82%AF%E3%82%A2%E3%82%B7%E3%82%B9%E3%82%BF%E3%83%B3%E3%83%88&c=apps">クリックアシスタントを検索</a><p class="note">検索結果から普段使っているアプリを選んでください。</p></section></main></body></html>
